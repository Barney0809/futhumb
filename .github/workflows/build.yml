name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RedisKeyUtilTest 不依赖外部服务；
      # ThumbApplicationTests 需要 MySQL + Redis，已用 THUMB_IT 开关默认跳过。
      - name: Test
        run: mvn -B test --no-transfer-progress
