spring.application.name=futhumb
spring.mvc.servlet.path=/api

# ==================== 点赞策略 ====================
# db    → ThumbServiceImpl       ：synchronized + 编程式事务，直接写库
# redis → ThumbRedisServiceImpl  ：Redis + Lua 原子计数，定时任务回写数据库
# mq    → ThumbMQServiceImpl     ：Pulsar 削峰，消费者落库
# 三个实现同时保留，改这一行即可切换（默认 redis）
app.thumb.strategy=${THUMB_STRATEGY:redis}

# ==================== 数据库 ====================
# 建库脚本见仓库根目录 sql/schema.sql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thumb_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
# 需要看 SQL 时取消注释（会把每条 SQL 打到 stdout，生产环境不要开）
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== Redis ====================
# 登录态（spring-session）、点赞计数、临时点赞记录都在这里
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=5000

# ==================== Pulsar（仅 strategy=mq 时需要） ====================
spring.pulsar.client.service-url=${PULSAR_SERVICE_URL:pulsar://localhost:6650}

# ==================== 接口文档 ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.fu.thumb
# knife4j 的增强配置，不需要增强可以去掉
knife4j.enable=true
knife4j.setting.language=zh_cn
